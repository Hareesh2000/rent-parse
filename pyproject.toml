[project]
name = "rent-parse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hareesh", email = "hareesh@swivl.tech" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.41.0",
    "pydantic>=2.14.2",
    "pytest-asyncio>=1.4.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
rent-parse = "rent_parse:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.mypy]
strict = true

[tool.ruff.lint]
# E: pycodestyle errors
# F: pyflakes
# I: isort (imports sorting)
# UP: pyupgrade (modern Python syntax)
# B: flake8-bugbear (common bugs/design issues)
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"